name: Capture Twitch Clip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade streamlink

      - name: Capture Twitch segment
        env:
          CHANNEL: https://www.twitch.tv/humzh
        run: |
          set -euo pipefail

          streamlink \
            --hls-start-offset 01:20:00 \
            "$CHANNEL" \
            480p30 \
            -o /tmp/capture.ts

          test -s /tmp/capture.ts

      - name: Convert to MP4
        run: |
          mkdir -p clips

          ffmpeg -y \
            -i /tmp/capture.ts \
            -t 30 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -movflags +faststart \
            clips/humzh_40m00s_40m30s.mp4

          test -s clips/humzh_40m00s_40m30s.mp4

      - name: Commit video to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clips/humzh_40m00s_40m30s.mp4

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add humzh Twitch clip"
            git push
          fi
