name: Record Twitch Broadcast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade streamlink

      - name: Record and commit broadcast
        timeout-minutes: 345
        env:
          CHANNEL: https://www.twitch.tv/humzh
        run: |
          set -euo pipefail

          mkdir -p recordings
          SEGMENT=1

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          while true; do
            printf -v NUMBER "%04d" "$SEGMENT"
            TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)

            echo "Recording segment $NUMBER"

            rm -f /tmp/segment.ts

            if ! streamlink \
              --retry-streams 1 \
              --stream-segmented-duration 300 \
              "$CHANNEL" \
              480p30 \
              -o /tmp/segment.ts; then
              echo "Stream ended or capture failed."
              break
            fi

            if [[ ! -s /tmp/segment.ts ]]; then
              echo "No video captured. Stopping."
              break
            fi

            OUTPUT="recordings/humzh_${NUMBER}_${TIMESTAMP}.mp4"

            ffmpeg -y \
              -i /tmp/segment.ts \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -c:a aac \
              -movflags +faststart \
              "$OUTPUT"

            if [[ ! -s "$OUTPUT" ]]; then
              echo "MP4 conversion failed."
              exit 1
            fi

            git add "$OUTPUT"
            git commit -m "Add Twitch recording segment $NUMBER"
            git push

            echo "Committed $OUTPUT"

            SEGMENT=$((SEGMENT + 1))
          done
