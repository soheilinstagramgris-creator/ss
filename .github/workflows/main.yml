
name: Capture Twitch Clip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --user --break-system-packages streamlink

      - name: Capture requested segment
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="https://www.twitch.tv/humzh"
          mkdir -p clips

          STREAMLINK="$HOME/.local/bin/streamlink"

          # Target: broadcast time 00:40:00 to 00:40:30.
          # Query Twitch for the currently available stream quality.
          "$STREAMLINK" "$CHANNEL" --stream-url > /tmp/stream_url.txt || {
            echo "Could not obtain a live stream URL."
            exit 1
          }

          URL="$(head -n 1 /tmp/stream_url.txt)"

          if [ -z "$URL" ]; then
            echo "No stream URL returned."
            exit 1
          fi

          # This is a best-effort rewind relative to the live edge.
          # Assumes the broadcast is currently around 2 hours long.
          "$STREAMLINK" \
            --hls-start-offset 01:20:00 \
            --stream-segmented-duration 30 \
            "$CHANNEL" 480p \
            -o /tmp/capture.ts

          test -s /tmp/capture.ts

          # Normalize to 480p and exactly 30 seconds.
          ffmpeg -y -i /tmp/capture.ts \
            -t 30 \
            -vf "scale=-2:480" \
            -c:v libx264 -preset veryfast -crf 27 \
            -c:a aac -b:a 96k \
            -movflags +faststart \
            clips/humzh_40m00s_40m30s.mp4

          test -s clips/humzh_40m00s_40m30s.mp4

      - name: Commit clip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clips/humzh_40m00s_40m30s.mp4

          if git diff --cached --quiet; then
            echo "No new clip to commit."
            exit 1
          fi

          git commit -m "Add Humzh Twitch clip"
          git push
          
